<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💖</title>
    <link rel="shortcut icon" href="heart.png" type="image/x-icon">

<body>
    <a href="../index.html" class="back-home-btn">← вернуться назад</a>

    <!-- КНОПКА ВКЛЮЧЕНИЯ/ВЫКЛЮЧЕНИЯ ЗВУКА СЛЕВА СНИЗУ -->
    <button id="mute-btn" style="
        position: fixed;
        bottom: 20px;
        left: 20px;
        z-index: 10001;
        background: rgba(255, 255, 255, 0.45);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border: 1px solid rgba(255, 255, 255, 0.4);
        border-radius: 50%;
        width: 50px;
        height: 50px;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 1.5rem;
        cursor: pointer;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        transition: all 0.2s ease;
    ">🔊</button>
